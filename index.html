<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>DOCX Font çevirici v.0.1</title>

        <!-- docx library -->
        <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
        <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
        <!-- file saver -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    </head>

    <body>
        <h2>*.docx Yüklə → Çevir → Endir</h2>

        <input type="file" id="fileInput" accept=".docx" />
        <button onclick="convertFile()">Çevir</button>

        <script>
            // Cyrillic → Latin mapping
            const source =
                "АБЖЧДЕЯФЭЕХЫИКГЛМНОЮПРСШЩТУЦВЙЗабжчдеяфэщхыикглмноюпрсштуцвйз";
            const target =
                "ABCÇDEƏFGHXIİKQLMNOÖPRSŞHTUÜVYZabcçdeəfghxıikqlmnoöprsştuüvyz";

            const map = {};
            for (let i = 0; i < source.length; i++) {
                map[source[i]] = target[i];
            }

            function convertText(text) {
                return [...text].map((c) => map[c] || c).join("");
            }

            async function convertFile() {
                const file = document.getElementById("fileInput").files[0];
                if (!file) return alert("Select a file");

                const arrayBuffer = await file.arrayBuffer();

                const result = await mammoth.extractRawText({ arrayBuffer });

                const converted = convertText(result.value);

                const blob = new Blob([converted], { type: "text/plain" });

                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "converted.txt";
                a.click();
            }
        </script>
    </body>
</html>
